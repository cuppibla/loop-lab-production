<svg viewBox="0 0 1600 780" xmlns="http://www.w3.org/2000/svg" font-family="Google Sans, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1116"/><stop offset="1" stop-color="#171c24"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="780" fill="url(#bg)"/>

  <text x="70" y="80" fill="#e8eaed" font-size="40" font-weight="700">The Production Floor</text>
  <text x="70" y="118" fill="#9aa0a6" font-size="21">who presses Continue? — doorbells · fan-out · the join · the backstop</text>
  <rect x="70" y="140" width="52" height="6" rx="3" fill="#4285F4"/>
  <rect x="126" y="140" width="52" height="6" rx="3" fill="#EA4335"/>
  <rect x="182" y="140" width="52" height="6" rx="3" fill="#FBBC04"/>
  <rect x="238" y="140" width="52" height="6" rx="3" fill="#34A853"/>

  <!-- climb path -->
  <path d="M 210 610 C 380 590 340 430 520 420 C 700 410 660 590 830 580 C 1000 570 950 300 1140 290 C 1240 285 1140 560 1230 552 C 1330 543 1320 250 1425 165"
        fill="none" stroke="#3c4043" stroke-width="3" stroke-dasharray="1 10" stroke-linecap="round"/>

  <!-- 01 -->
  <g transform="translate(70,520)">
    <rect width="280" height="170" rx="16" fill="#1b2027" stroke="#34A853" stroke-width="1.6"/>
    <circle cx="40" cy="42" r="20" fill="#34A853"/>
    <text x="40" y="49" text-anchor="middle" fill="#0e1116" font-size="19" font-weight="700">01</text>
    <text x="72" y="49" fill="#e8eaed" font-size="21" font-weight="600">One long job</text>
    <text x="24" y="86" fill="#bdc1c6" font-size="15">"A running render" is two rows</text>
    <text x="24" y="108" fill="#bdc1c6" font-size="15">and no process at all.</text>
    <rect x="24" y="126" width="192" height="26" rx="13" fill="#0e1116"/>
    <text x="120" y="144" text-anchor="middle" fill="#8ab4f8" font-size="13" font-family="monospace">LongRunningFunctionTool</text>
  </g>

  <!-- 02 -->
  <g transform="translate(390,330)">
    <rect width="280" height="170" rx="16" fill="#1b2027" stroke="#4285F4" stroke-width="1.6"/>
    <circle cx="40" cy="42" r="20" fill="#4285F4"/>
    <text x="40" y="49" text-anchor="middle" fill="#0e1116" font-size="19" font-weight="700">02</text>
    <text x="72" y="49" fill="#e8eaed" font-size="21" font-weight="600">Two doorbells</text>
    <text x="24" y="86" fill="#bdc1c6" font-size="15">Machine and human wake-ups are</text>
    <text x="24" y="108" fill="#bdc1c6" font-size="15">the same function_response.</text>
    <rect x="24" y="126" width="150" height="26" rx="13" fill="#0e1116"/>
    <text x="99" y="144" text-anchor="middle" fill="#8ab4f8" font-size="13" font-family="monospace">ring(call_id, …)</text>
  </g>

  <!-- 03 -->
  <g transform="translate(700,490)">
    <rect width="280" height="170" rx="16" fill="#1b2027" stroke="#EA4335" stroke-width="1.6"/>
    <circle cx="40" cy="42" r="20" fill="#EA4335"/>
    <text x="40" y="49" text-anchor="middle" fill="#0e1116" font-size="19" font-weight="700">03</text>
    <text x="72" y="49" fill="#e8eaed" font-size="21" font-weight="600">The join</text>
    <text x="24" y="86" fill="#bdc1c6" font-size="15">The model ships at 3/4.</text>
    <text x="24" y="108" fill="#bdc1c6" font-size="15">The driver counts the world.</text>
    <rect x="24" y="126" width="188" height="26" rx="13" fill="#0e1116"/>
    <text x="118" y="144" text-anchor="middle" fill="#8ab4f8" font-size="13" font-family="monospace">done_passed_count()</text>
  </g>

  <!-- 04 · highlight -->
  <g transform="translate(1000,200)">
    <rect width="300" height="182" rx="16" fill="#241d0e" stroke="#FBBC04" stroke-width="2.6" filter="url(#glow)"/>
    <circle cx="40" cy="42" r="20" fill="#FBBC04"/>
    <text x="40" y="49" text-anchor="middle" fill="#0e1116" font-size="19" font-weight="700">04</text>
    <text x="72" y="49" fill="#ffd970" font-size="21" font-weight="700">When no one rings</text>
    <text x="24" y="86" fill="#e8d5a8" font-size="15">Lost bells. Ghost pendings.</text>
    <text x="24" y="108" fill="#e8d5a8" font-size="15">A crashed turn is answered AS A SET.</text>
    <rect x="24" y="130" width="230" height="26" rx="13" fill="#0e1116"/>
    <text x="139" y="148" text-anchor="middle" fill="#fdd663" font-size="13" font-family="monospace">backstop.py — session↔world diff</text>
  </g>

  <!-- 05 -->
  <g transform="translate(1080,470)">
    <rect width="280" height="170" rx="16" fill="#1b2027" stroke="#A142F4" stroke-width="1.6"/>
    <circle cx="40" cy="42" r="20" fill="#A142F4"/>
    <text x="40" y="49" text-anchor="middle" fill="#0e1116" font-size="19" font-weight="700">05</text>
    <text x="72" y="49" fill="#e8eaed" font-size="21" font-weight="600">Broadcast</text>
    <text x="24" y="86" fill="#bdc1c6" font-size="15">Same run, typed events —</text>
    <text x="24" y="108" fill="#bdc1c6" font-size="15">a robot attendee grades you.</text>
    <rect x="24" y="126" width="160" height="26" rx="13" fill="#0e1116"/>
    <text x="104" y="144" text-anchor="middle" fill="#8ab4f8" font-size="13" font-family="monospace">check.py → PASS</text>
  </g>

  <!-- 06 -->
  <g transform="translate(1330,60)">
    <rect width="220" height="140" rx="16" fill="#16202e" stroke="#8ab4f8" stroke-width="1.6"/>
    <circle cx="36" cy="38" r="18" fill="#8ab4f8"/>
    <text x="36" y="44" text-anchor="middle" fill="#0e1116" font-size="17" font-weight="700">06</text>
    <text x="64" y="44" fill="#e8eaed" font-size="19" font-weight="600">Cloud</text>
    <text x="22" y="76" fill="#bdc1c6" font-size="14">Real Veo webhooks.</text>
    <text x="22" y="96" fill="#bdc1c6" font-size="14">The deadline is the</text>
    <text x="22" y="116" fill="#bdc1c6" font-size="14">third doorbell.</text>
  </g>

  <!-- footer takeaway -->
  <text x="70" y="740" fill="#9aa0a6" font-size="17" font-family="monospace">drive(session, …) — what changes is who calls it, never what it is.</text>
  <text x="1530" y="740" text-anchor="end" fill="#5f6368" font-size="14">loop-lab-production · ADK 2.5</text>
</svg>
